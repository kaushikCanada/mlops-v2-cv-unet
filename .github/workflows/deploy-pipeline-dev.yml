name: Deploy UNet Pipeline - Dev

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: 'Data directory path (azureml://...)'
        required: true
        type: string
      config_path:
        description: 'Config YAML path (azureml://...)'
        required: true
        type: string

env:
  ENVIRONMENT: dev

jobs:
  deploy-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install azure-ai-ml azure-identity pyyaml

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Config File from Secrets
        run: |
          cat > config/config-dev.yml << EOF
          # Development Environment Configuration
          # This file is created dynamically from GitHub Secrets
          
          subscription_id: "${{ secrets.DEV_SUBSCRIPTION_ID }}"
          resource_group: "${{ secrets.DEV_RESOURCE_GROUP }}"
          workspace_name: "${{ secrets.DEV_WORKSPACE_NAME }}"
          cpu_compute_name: "${{ secrets.DEV_CPU_COMPUTE_NAME }}"
          gpu_compute_name: "${{ secrets.DEV_GPU_COMPUTE_NAME }}"
          default_datastore: "${{ secrets.DEV_DEFAULT_DATASTORE }}"
          environment_name: "${{ secrets.DEV_ENVIRONMENT_NAME }}"
          EOF

      - name: Deploy Pipeline Component and Endpoint
        env:
          AZURE_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          python - <<EOF
          import yaml
          import os
          from pathlib import Path
          from azure.identity import DefaultAzureCredential
          from azure.ai.ml import MLClient
          from azure.ai.ml.entities import PipelineComponent, PipelineJob
          from azure.ai.ml import load_job, load_component
          import json

          # Load config
          config_path = Path("config/config-dev.yml")
          with open(config_path, "r") as f:
              config = yaml.safe_load(f)

          # Get ML Client
          credential = DefaultAzureCredential()
          ml_client = MLClient(
              credential=credential,
              subscription_id=config["subscription_id"],
              resource_group_name=config["resource_group"],
              workspace_name=config["workspace_name"],
          )

          # Substitute variables in pipeline YAML
          pipeline_yaml = Path("mlops/azureml/train/pipeline.yaml")
          with open(pipeline_yaml, "r") as f:
              content = f.read()
          
          content = content.replace("\${environment_name}", config["environment_name"])
          content = content.replace("\${default_datastore}", config["default_datastore"])
          content = content.replace("\${cpu_compute_name}", config["cpu_compute_name"])
          content = content.replace("\${gpu_compute_name}", config["gpu_compute_name"])

          temp_yaml = Path("mlops/azureml/train/pipeline_temp.yaml")
          with open(temp_yaml, "w") as f:
              f.write(content)

          try:
              # Load pipeline job
              pipeline_job = load_job(temp_yaml)
              
              # Create or update pipeline component
              component_name = "unet-pipeline-component"
              try:
                  existing_component = ml_client.components.get(component_name, version="1")
                  print(f"Component {component_name} exists, updating...")
                  ml_client.components.archive(component_name, version="1")
              except:
                  print(f"Component {component_name} does not exist, creating...")
              
              # Create new version
              pipeline_component = PipelineComponent(
                  name=component_name,
                  version="1",
                  description="UNet Semantic Segmentation Pipeline",
                  jobs=pipeline_job.jobs,
                  inputs=pipeline_job.inputs,
                  outputs=pipeline_job.outputs,
              )
              
              ml_client.components.create_or_update(pipeline_component)
              print(f"Pipeline component {component_name} created/updated successfully")

              # Create or update pipeline endpoint
              endpoint_name = "unet-pipeline-endpoint-dev"
              print(f"Pipeline endpoint: {endpoint_name}")
              print("Pipeline endpoint creation requires additional setup")
              print("You can create it manually via Azure ML Studio or use az ml CLI")

          finally:
              if temp_yaml.exists():
                  temp_yaml.unlink()
          EOF

      - name: Run Pipeline (Optional)
        if: ${{ github.event.inputs.data_dir != '' && github.event.inputs.config_path != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          python mlops/azureml/train/submit_pipeline.py \
            --env dev \
            --data_dir "${{ github.event.inputs.data_dir }}" \
            --config_path "${{ github.event.inputs.config_path }}" \
            --experiment_name unet_train_dev
