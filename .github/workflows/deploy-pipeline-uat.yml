name: Deploy UNet Pipeline - UAT

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: 'Data directory path (azureml://...) - leave empty for deploy-only'
        required: false
        type: string
      config_path:
        description: 'Config YAML path (azureml://...) - leave empty for deploy-only'
        required: false
        type: string

env:
  ENVIRONMENT: uat

jobs:
  deploy-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install azure-ai-ml azure-identity pyyaml

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Config File from Secrets
        run: |
          cat > config/config-uat.yml << EOF
          # UAT Environment Configuration
          # This file is created dynamically from GitHub Secrets
          
          subscription_id: "${{ secrets.UAT_SUBSCRIPTION_ID }}"
          resource_group: "${{ secrets.UAT_RESOURCE_GROUP }}"
          workspace_name: "${{ secrets.UAT_WORKSPACE_NAME }}"
          cpu_compute_name: "${{ secrets.UAT_CPU_COMPUTE_NAME }}"
          gpu_compute_name: "${{ secrets.UAT_GPU_COMPUTE_NAME }}"
          default_datastore: "${{ secrets.UAT_DEFAULT_DATASTORE }}"
          environment_name: "${{ secrets.UAT_ENVIRONMENT_NAME }}"
          EOF

      - name: Deploy Batch Endpoint
        run: python mlops/azureml/train/deploy_endpoint.py --env uat

      - name: Run Pipeline (Optional)
        if: ${{ github.event.inputs.data_dir != '' && github.event.inputs.config_path != '' }}
        run: |
          python mlops/azureml/train/submit_pipeline.py \
            --env uat \
            --data_dir "${{ github.event.inputs.data_dir }}" \
            --config_path "${{ github.event.inputs.config_path }}" \
            --experiment_name unet_train_uat
